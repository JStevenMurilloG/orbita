<!doctype html>
<html lang="es">
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f5f5f7;
      font-family:
        system-ui,
        -apple-system,
        &quot;Segoe UI&quot;,
        Roboto,
        sans-serif;
      color: #18181b;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="
        max-width: 480px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 12px;
        padding: 32px;
      "
    >
      <tr>
        <td>
          <p style="margin: 0 0 24px; font-weight: 600; font-size: 18px; color: #4f46e5">Órbita</p>
          <h1 style="margin: 0 0 12px; font-size: 20px">Restablece tu contraseña</h1>
          <p style="margin: 0 0 24px; line-height: 1.5">
            Recibimos una solicitud para restablecer la contraseña de tu cuenta de Órbita.
          </p>
          <p style="margin: 0 0 24px">
            <a
              href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/restablecer"
              style="
                display: inline-block;
                background: #4f46e5;
                color: #ffffff;
                text-decoration: none;
                padding: 12px 20px;
                border-radius: 8px;
                font-weight: 600;
              "
              >Elegir una nueva contraseña</a
            >
          </p>
          <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #71717a">
            Si no pediste este cambio, ignora este mensaje: tu contraseña seguirá siendo la misma.
            El enlace caduca en 1 hora.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
